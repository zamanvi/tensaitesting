<VirtualHost *:8080>
    DocumentRoot /app/public

    SetEnv HTTPS on

    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "upgrade-insecure-requests"
    </IfModule>

    # Apache's stock deflate config covers HTML/CSS/JS but not JSON, so API responses
    # (feed, gallery, ...) went out uncompressed. Same bytes after decompression.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    <Directory /app/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
</VirtualHost>
